# ===== GitHub Pages 部署工作流 =====
# 触发条件: 推送到 main/master 分支,或手动触发
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 写入 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署,避免冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        # 注意: 首次部署前需在仓库 Settings → Pages 手动启用一次
        # Source 选择 "GitHub Actions"

      - name: Upload artifact
        # 直接把仓库根目录作为静态站点产物 (零构建,无需 build 步骤)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
